# Example: run job-board-watcher on a schedule with GitHub Actions and get the digest by email.
# Copy to .github/workflows/watch.yml in a PRIVATE repo that holds your config.yaml and companies.yaml,
# and add repository secrets SMTP_USER and SMTP_PASSWORD (for Gmail, an app password), optionally EMAIL_TO.
name: Job watch

on:
  schedule:
    - cron: "17 14 * * 1-5"   # weekdays 14:17 UTC; GitHub may start scheduled runs late
  workflow_dispatch: {}

permissions:
  contents: write              # to save state/ (what has been reported) back to the repo

concurrency:
  group: job-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/checkout@v5   # the code, pinned to a release
        with:
          repository: nk3843/job-board-watcher
          ref: v1.0.0
          path: app
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt
      - name: Check for new postings
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python app/watch.py --config config.yaml --companies companies.yaml
      - name: Save what was seen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ output/ data/
          git diff --cached --quiet || git commit -m "job-watch $(date -u '+%F %H:%M')"
          git pull --rebase
          git push
